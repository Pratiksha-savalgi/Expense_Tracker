<dialog class="expense-modal" data-expense-modal data-auto-open="{{ 'true' if show_expense_modal else 'false' }}" data-today="{{ today }}" data-yesterday="{{ yesterday }}" aria-labelledby="expense-modal-title">
  <div class="expense-modal-header">
    <h2 id="expense-modal-title">Add expense</h2>
    <form method="post" action="{{ url_for('dismiss_expense_modal') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="return_to" value="{{ modal_return_to }}">
      <button class="expense-modal-close" type="submit" aria-label="Close Add Expense">×</button>
    </form>
  </div>

  {% if modal_errors %}
  <div class="expense-modal-errors" role="alert">
    {% for error in modal_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
  {% endif %}

  <form class="expense-modal-form" method="post" action="{{ url_for('add_expense') }}" data-modal-expense-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="date_period" value="{{ modal_expense.date_period|default('today') }}" data-modal-date-period-value>
    <input type="hidden" name="return_to" value="{{ modal_return_to }}">
    <div class="field">
      <label for="modal-amount">Amount <span class="required-mark">*</span></label>
      <div class="amount-input">
        <span aria-hidden="true">₹</span>
        <input id="modal-amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required value="{{ modal_expense.amount }}" placeholder="0.00">
      </div>
    </div>
    <div class="field">
      <label for="modal-category">Category <span class="required-mark">*</span></label>
      <select id="modal-category" name="category_id" required data-modal-category>
        <option value="">Choose a category</option>
        {% for category in modal_categories %}
        <option value="{{ category.id }}" {% if modal_expense.category_id|string == category.id|string %}selected{% endif %}>{{ category.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <span class="field-label">Date <span class="required-mark">*</span></span>
      <div class="date-filter-options add-expense-date-options" role="group" aria-label="Expense date">
        <button class="date-filter-option {% if modal_expense.date_period|default('today') == 'today' %}is-active{% endif %}" type="button" data-modal-date-period="today" aria-pressed="{{ 'true' if modal_expense.date_period|default('today') == 'today' else 'false' }}">Today</button>
        <button class="date-filter-option {% if modal_expense.date_period == 'yesterday' %}is-active{% endif %}" type="button" data-modal-date-period="yesterday" aria-pressed="{{ 'true' if modal_expense.date_period == 'yesterday' else 'false' }}">Yesterday</button>
        <label class="date-picker-option {% if modal_expense.date_period == 'custom' %}is-active{% endif %}" for="modal-expense-date">
          <span>Date</span>
          <input id="modal-expense-date" name="expense_date" type="date" required max="{{ today }}" value="{{ modal_expense.expense_date|default(today) }}" aria-label="Choose expense date" data-modal-date-picker>
          <svg class="date-picker-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M4 9.5h16M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>
        </label>
      </div>
    </div>
    <div class="field">
      <label for="modal-description">Description <span class="optional-mark">Optional</span></label>
      <textarea id="modal-description" name="description" rows="2" placeholder="What was this expense for?">{{ modal_expense.description }}</textarea>
    </div>
    <div class="form-actions">
      <button class="button button-primary" type="submit">Save expense</button>
    </div>
  </form>

  {% if modal_success %}
  <div class="expense-save-success" role="alertdialog" aria-modal="true" aria-labelledby="expense-save-success-title" data-expense-save-success>
    <div>
      <span class="empty-mark" aria-hidden="true">✓</span>
      <p id="expense-save-success-title">Expense saved successfully.</p>
      <button class="button button-primary" type="button" data-confirm-expense-save>OK</button>
    </div>
  </div>
  {% endif %}
</dialog>
