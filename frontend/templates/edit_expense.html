{% extends "base.html" %}
{% block title %}Edit expense{% endblock %}
{% block content %}
<div class="content-narrow">
  <a class="back-link" href="{{ return_to or url_for('expenses') }}"><span aria-hidden="true">←</span> All expenses</a>
  <section class="form-page-heading">
    <p class="eyebrow">Expense record</p>
    <h1>Edit an expense</h1>
    <p>Update the details below and save your changes.</p>
  </section>
  <form method="post" class="entry-form" data-expense-form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if return_to %}<input type="hidden" name="return_to" value="{{ return_to }}">{% endif %}
    <div class="field-grid">
      <div class="field field-wide">
        <label for="amount">Amount <span class="required-mark">*</span></label>
        <div class="amount-input"><span aria-hidden="true">₹</span><input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required value="{{ expense.amount }}"></div>
      </div>
      <div class="field">
        <label for="category">Category <span class="required-mark">*</span></label>
        <select id="category" name="category_id" required>
          <option value="">Choose a category</option>
          {% for category in categories %}
          <option value="{{ category.id }}" {% if expense.category_id|string == category.id|string %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
          <option value="__new__" {% if expense.category_id == '__new__' %}selected{% endif %}>+ Add category...</option>
        </select>
      </div>
      <div class="field">
        <label for="expense_date">Date <span class="required-mark">*</span></label>
        <input id="expense_date" name="expense_date" type="date" required value="{{ expense.expense_date }}" max="{{ today | default('') }}">
      </div>
      <div class="field field-wide" id="new-category-field" {% if expense.category_id != '__new__' %}hidden{% endif %}>
        <label for="new_category">New category <span class="required-mark">*</span></label>
        <input id="new_category" name="new_category" type="text" value="{{ expense.new_category or '' }}" {% if expense.category_id == '__new__' %}required{% endif %}>
      </div>
      <div class="field field-wide">
        <label for="description">Description <span class="optional-mark">Optional</span></label>
        <textarea id="description" name="description" rows="3" placeholder="What was this expense for?">{{ expense.description }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <a class="button button-quiet" href="{{ url_for('expenses') }}">Cancel</a>
      <button class="button button-primary" type="submit">Save changes <span aria-hidden="true">→</span></button>
    </div>
  </form>
</div>
{% endblock %}
