{% extends "base.html" %}
{% block title %}Edit expense{% endblock %}
{% block content %}
<div class="content-narrow">
  <a class="back-link" href="{{ url_for('dashboard') }}"><span aria-hidden="true">←</span> All expenses</a>
  <section class="form-page-heading">
    <p class="eyebrow">Expense record</p>
    <h1>Edit an expense</h1>
    <p>Update the details below and save your changes.</p>
  </section>
  <form method="post" class="entry-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-grid">
      <div class="field field-wide">
        <label for="amount">Amount <span class="required-mark">*</span></label>
        <div class="amount-input"><span aria-hidden="true">₹</span><input id="amount" name="amount" type="number" min="0" step="any" inputmode="decimal" required value="{{ expense.amount }}"></div>
      </div>
      <div class="field">
        <label for="category">Category <span class="required-mark">*</span></label>
        <input id="category" name="category" type="text" required value="{{ expense.category }}">
      </div>
      <div class="field">
        <label for="expense_date">Date <span class="required-mark">*</span></label>
        <input id="expense_date" name="expense_date" type="date" required value="{{ expense.expense_date }}">
      </div>
      <div class="field field-wide">
        <label for="description">Description <span class="optional-mark">Optional</span></label>
        <textarea id="description" name="description" rows="3" placeholder="What was this expense for?">{{ expense.description }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <a class="button button-quiet" href="{{ url_for('dashboard') }}">Cancel</a>
      <button class="button button-primary" type="submit">Save changes <span aria-hidden="true">→</span></button>
    </div>
  </form>
</div>
{% endblock %}
